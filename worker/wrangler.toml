name = "pdf-insight-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Public endpoint: https://pdf-insight-api.kqjqxb.workers.dev
workers_dev = true
# No per-version preview URLs: every public URL must go through the same CORS and rate limits.
preview_urls = false

# Public, non-secret configuration only. ALLOWED_ORIGIN may be a comma-separated list (exact matches).
# GEMINI_API_KEY is a secret: `wrangler secret put GEMINI_API_KEY` (prod) or worker/.dev.vars (local).
[vars]
ALLOWED_ORIGIN = "https://kqjqxb.github.io"
# Gemini model ids (free tier). Change here without touching code.
# The fallback is used when the primary returns 503/timeout/429 (each model has its own quota,
# free tier: 20 requests per day per model). Both chosen by measuring the test PDF in stage 3.
GEMINI_MODEL = "gemini-3.6-flash"
GEMINI_FALLBACK_MODEL = "gemini-3.5-flash-lite"

# Per-IP limit for POST /analyze: 10 requests per 60 s (period may only be 10 or 60).
# namespace_id is a positive integer chosen by us, unique within the Cloudflare account.
[[ratelimits]]
name = "ANALYZE_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }
